<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>监控管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:26px 14px 48px;background:#f5f6f8;color:#1f2430;font-size:14px;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:20px;margin:0 0 14px;text-align:center}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:14px;padding:18px;margin-bottom:14px;
box-shadow:0 1px 2px rgba(16,24,40,.04)}
label{display:block;font-size:12px;color:#6f7684;margin:0 0 7px}
input{width:100%;border:1px solid #dfe4ec;border-radius:10px;padding:12px;font-size:15px;
background:#fff;color:#1f2430;outline:none;font-family:inherit}
input:focus{border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
button{border:0;border-radius:10px;padding:12px 16px;font-size:14px;cursor:pointer;
background:#eceff4;color:#1f2430;font-family:inherit}
button.main{background:#2f6bff;color:#fff;width:100%}
button.mini{padding:7px 12px;font-size:12px;border-radius:8px}
button.del{background:#fdecec;color:#c33}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.row>div{flex:1}.row>div:last-child{flex:0 0 auto}
.msg{font-size:12.5px;line-height:1.8;margin-top:10px;min-height:18px}
.ok{color:#0e8f6e}.bad{color:#c33}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
.note{font-size:11px;color:#98a2b3;text-align:center;line-height:1.8;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>监控管理后台</h1>

  <div class="card" id="loginBox">
    <label>密码</label>
    <input id="pass" type="password" placeholder="输入密码" autocomplete="off">
    <div style="margin-top:14px"><button class="main" onclick="login()">进入</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="top">
      <span style="font-size:12.5px;color:#6f7684" id="count"></span>
      <div><button class="mini" onclick="addRow()">＋ 新增</button>
      <button class="mini" onclick="logout()">退出</button></div>
    </div>
    <div class="card"><div id="rows"></div></div>
    <button class="main" onclick="save()">保存并提交</button>
    <div class="msg" id="msg"></div>
  </div>

  <p class="note">密码只保存在本机浏览器，不会上传。</p>
</div>

<script>
var REPO = 'webcstx/signature', FILE = '.upptimerc.yml', BRANCH = 'master';
var API = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE;
var $ = function(id){ return document.getElementById(id); };
var key = '';

function say(kind, text, el){
  var m = $(el || 'msg');
  m.className = 'msg ' + (kind || '');
  m.textContent = text || '';
}

function enc(s){
  return btoa(unescape(encodeURIComponent(s)));
}
function dec(s){
  return decodeURIComponent(escape(atob(s.replace(/[\r\n\t ]/g, ''))));
}

function headers(){
  return { 'Authorization': 'Bearer ' + key, 'Accept': 'application/vnd.github+json',
           'Content-Type': 'application/json' };
}

function gh(path, opts){
  return fetch('https://api.github.com' + path, Object.assign({ headers: headers() }, opts || {}))
    .then(function(r){
      if (r.status === 401) throw new Error('密码错误或已失效');
      if (r.status === 404) throw new Error('没有这个仓库的权限');
      if (r.status === 409) throw new Error('配置刚被别人改过，刷新后重试');
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.message || ('HTTP ' + r.status));
        return d;
      });
    });
}

function addRow(name, url){
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<div><label>名称</label><input class="nm"></div>' +
                '<div><label>地址</label><input class="ur" autocapitalize="off"></div>' +
                '<div><button class="mini del">删</button></div>';
  d.querySelector('.nm').value = name || '';
  d.querySelector('.ur').value = url || '';
  d.querySelector('.del').onclick = function(){ d.remove(); count(); };
  $('rows').appendChild(d);
  count();
}

function count(){
  var n = $('rows').querySelectorAll('.row').length;
  $('count').textContent = n + ' 个站点';
}

function collect(){
  var out = [], rows = $('rows').querySelectorAll('.row');
  for (var i = 0; i < rows.length; i++){
    var n = rows[i].querySelector('.nm').value.trim();
    var u = rows[i].querySelector('.ur').value.trim();
    if (n || u) out.push({ name: n, url: u });
  }
  return out;
}

function parse(text){
  var lines = text.split(/\r?\n/), start = -1, end = lines.length;
  for (var i = 0; i < lines.length; i++){
    if (start === -1 && /^sites:\s*$/.test(lines[i])) start = i;
    else if (start !== -1 && /^[A-Za-z_][A-Za-z0-9_-]*:/.test(lines[i])) { end = i; break; }
  }
  var sites = [], cur = null;
  if (start === -1) return { head: '', tail: text, sites: sites };
  lines.slice(start + 1, end).forEach(function(line){
    var mn = line.match(/^\s*-?\s*name:\s*(.*)$/);
    var mu = line.match(/^\s*url:\s*(.*)$/);
    if (mn){ if (cur) sites.push(cur); cur = { name: mn[1].trim().replace(/^["']|["']$/g,''), url: '' }; }
    else if (mu && cur){ cur.url = mu[1].trim().replace(/^["']|["']$/g,''); }
  });
  if (cur) sites.push(cur);
  return { head: lines.slice(0, start).join('\n'), tail: lines.slice(end).join('\n'), sites: sites };
}

function rebuild(p, sites){
  var block = 'sites:\n' + sites.map(function(s){
    return '  - name: ' + s.name + '\n    url: ' + s.url;
  }).join('\n') + '\n';
  var out = p.head ? p.head.replace(/\s*$/, '\n') + block : block;
  if (p.tail) out += '\n' + p.tail.replace(/^\s*\n/, '');
  return out;
}

function load(){
  say('', '读取中…');
  gh('/repos/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH).then(function(d){
    var text = dec(d.content);
    var p = parse(text);
    $('rows').innerHTML = '';
    p.sites.forEach(function(s){ addRow(s.name, s.url); });
    if (!p.sites.length) addRow();
    $('loginBox').classList.add('hidden');
    $('panel').classList.remove('hidden');
    say('', '');
    window.__sha = d.sha;
  }).catch(function(e){
    say('bad', '读取失败：' + e.message);
  });
}

function login(){
  var pw = $('pass').value.trim();
  if (!pw){ say('bad', '请输入密码', 'loginMsg'); return; }
  key = pw;
  say('', '验证中…', 'loginMsg');
  gh('/repos/' + REPO).then(function(){
    localStorage.setItem('wc_key', pw);
    say('', '', 'loginMsg');
    load();
  }).catch(function(e){
    key = '';
    say('bad', e.message, 'loginMsg');
  });
}

function save(){
  var sites = collect();
  if (!sites.length){ say('bad', '至少保留一个站点'); return; }
  for (var i = 0; i < sites.length; i++){
    if (!sites[i].name || !sites[i].url){ say('bad', '第 ' + (i+1) + ' 行没填完整'); return; }
    if (!/^https?:\/\/[^\s]+$/.test(sites[i].url)){ say('bad', '第 ' + (i+1) + ' 行地址要以 http(s):// 开头'); return; }
  }
  say('', '提交中…');
  gh('/repos/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH).then(function(d){
    window.__sha = d.sha;
    var next = rebuild(parse(dec(d.content)), sites);
    return gh('/repos/' + REPO + '/contents/' + FILE, {
      method: 'PUT',
      body: JSON.stringify({ message: '更新监控配置', content: enc(next), sha: d.sha, branch: BRANCH })
    });
  }).then(function(d){
    window.__sha = (d.content && d.content.sha) || '';
    say('ok', '已保存，commit ' + String((d.commit && d.commit.sha) || '').slice(0, 7));
  }).catch(function(e){
    say('bad', '保存失败：' + e.message);
  });
}

function logout(){
  localStorage.removeItem('wc_key');
  key = '';
  $('panel').classList.add('hidden');
  $('loginBox').classList.remove('hidden');
  $('pass').value = '';
  say('', '', 'loginMsg');
}

(function(){
  var saved = localStorage.getItem('wc_key');
  if (!saved) return;
  key = saved;
  gh('/repos/' + REPO).then(function(){ load(); }).catch(function(){ logout(); });
})();
</script>
</body>
</html>
