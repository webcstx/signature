<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三模型对话 · 豆包 / 千问 / DeepSeek</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2329; display: flex; justify-content: center; padding: 20px 12px;
  }
  .wrap { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  .sub { font-size: 12px; color: #8a9099; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #dfe2e7; background: #fff; color: #1f2329;
    padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer;
    transition: all .15s;
  }
  .tab:hover { border-color: #b9c0ca; }
  .tab.active { background: #1f2329; color: #fff; border-color: #1f2329; }
  .tab[disabled] { opacity: .45; cursor: not-allowed; }
  .panel { background: #fff; border: 1px solid #e5e8ec; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .chat { padding: 16px; min-height: 320px; max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .empty { color: #9aa1aa; font-size: 13px; text-align: center; margin: auto; line-height: 1.9; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 13px; border-radius: 10px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: #1f2329; color: #fff; }
  .assistant .bubble { background: #f2f4f7; color: #1f2329; }
  .err .bubble { background: #fff1f0; color: #c0392b; }
  .bubble .who { display: block; font-size: 11px; opacity: .55; margin-bottom: 4px; }
  .composer { border-top: 1px solid #eceff3; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  textarea {
    width: 100%; min-height: 84px; max-height: 200px; resize: vertical;
    border: 1px solid #dfe2e7; border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; line-height: 1.6; outline: none;
  }
  textarea:focus { border-color: #1f2329; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .count { font-size: 12px; color: #8a9099; }
  .count.over { color: #c0392b; font-weight: 600; }
  .count.warn { color: #b7791f; }
  button.send {
    border: 0; background: #1f2329; color: #fff; padding: 9px 20px;
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  button.send[disabled] { opacity: .45; cursor: not-allowed; }
  button.ghost { border: 1px solid #dfe2e7; background: #fff; padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #1f2329; }
  .hint { font-size: 12px; color: #8a9099; }
  code { background: #f2f4f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>三模型对话</h1>
    <div class="sub">豆包 / 通义千问 / DeepSeek · 随时切换</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="chat" id="chat">
      <div class="empty" id="empty">选一个模型，说点什么。<br>单次对话上限 40000 字，同一 IP 最少间隔 1 秒。</div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="输入内容，Ctrl + Enter 发送"></textarea>
      <div class="bar">
        <div class="count" id="count">0 / 40000 字</div>
        <div style="display:flex;gap:8px;">
          <button class="ghost" id="clearBtn">清空对话</button>
          <button class="send" id="sendBtn">发送</button>
        </div>
      </div>
      <div class="hint" id="hint">就绪</div>
    </div>
  </div>
</div>

<script>
const state = {
  models: [],
  current: null,
  history: [],
  maxChars: 40000,
  minInterval: 1000,
  lastSendAt: 0,
  busy: false
};

const el = {
  tabs: document.getElementById('tabs'),
  chat: document.getElementById('chat'),
  empty: document.getElementById('empty'),
  input: document.getElementById('input'),
  count: document.getElementById('count'),
  hint: document.getElementById('hint'),
  send: document.getElementById('sendBtn'),
  clear: document.getElementById('clearBtn')
};

function renderTabs() {
  el.tabs.innerHTML = '';
  state.models.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (state.current === m.id ? ' active' : '');
    btn.textContent = m.label;
    if (!m.enabled) {
      btn.disabled = true;
      btn.title = '没有配置这个模型的密钥';
      btn.textContent = m.label + '（未配密钥）';
    }
    btn.onclick = () => {
      state.current = m.id;
      state.history = [];
      renderTabs();
      clearChat();
      el.hint.textContent = '已切换：' + m.label + '（' + m.model + '）';
    };
    el.tabs.appendChild(btn);
  });
}

function clearChat() {
  state.history = [];
  el.chat.innerHTML = '';
  el.chat.appendChild(el.empty);
  el.empty.style.display = '';
}

function appendMsg(role, text, who) {
  el.empty.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (who) {
    const tag = document.createElement('span');
    tag.className = 'who';
    tag.textContent = who;
    bubble.appendChild(tag);
  }
  bubble.appendChild(document.createTextNode(text));
  row.appendChild(bubble);
  el.chat.appendChild(row);
  el.chat.scrollTop = el.chat.scrollHeight;
}

function totalChars() {
  return state.history.reduce((sum, m) => sum + m.content.length, 0);
}

function updateCount() {
  const used = totalChars() + el.input.value.length;
  el.count.textContent = used + ' / ' + state.maxChars + ' 字';
  el.count.className = 'count' + (used > state.maxChars ? ' over' : (used > state.maxChars * 0.9 ? ' warn' : ''));
}

async function send() {
  if (state.busy || !state.current) return;
  const text = el.input.value.trim();
  if (!text) return;

  const now = Date.now();
  const wait = state.minInterval - (now - state.lastSendAt);
  if (wait > 0) {
    el.hint.textContent = '等一下：' + Math.ceil(wait / 1000) + ' 秒后才能再请求';
    setTimeout(() => { el.hint.textContent = '就绪'; }, wait + 200);
    return;
  }

  const history = state.history.concat([{ role: 'user', content: text }]);
  if (history.reduce((s, m) => s + m.content.length, 0) > state.maxChars) {
    el.hint.textContent = '已超过 ' + state.maxChars + ' 字上限，先清空对话';
    return;
  }

  state.busy = true;
  el.send.disabled = true;
  el.hint.textContent = '请求中…';
  appendMsg('user', text);
  el.input.value = '';
  updateCount();

  state.lastSendAt = Date.now();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: state.current, messages: history })
    });
    const data = await resp.json();

    if (!resp.ok) {
      const msg = data.error + (data.detail ? '：' + data.detail : '');
      appendMsg('err', msg, '出错');
      el.hint.textContent = '请求失败（HTTP ' + resp.status + '）';
    } else {
      appendMsg('assistant', data.reply, (data.model_name || data.model));
      state.history = history.concat([{ role: 'assistant', content: data.reply }]);
      el.hint.textContent = '完成 · 本次输入 ' + data.chars + ' 字';
      updateCount();
    }
  } catch (e) {
    appendMsg('err', '网络错误：' + e.message, '出错');
    el.hint.textContent = '网络错误';
  } finally {
    state.busy = false;
    el.send.disabled = false;
  }
}

el.send.onclick = send;
el.clear.onclick = () => { clearChat(); el.input.value = ''; updateCount(); el.hint.textContent = '已清空'; };
el.input.addEventListener('input', updateCount);
el.input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

(async function init() {
  try {
    const resp = await fetch('/api/models');
    const data = await resp.json();
    state.models = data.models;
    state.maxChars = data.max_chars;
    state.minInterval = data.min_interval_ms;
    const firstEnabled = state.models.find(m => m.enabled);
    state.current = firstEnabled ? firstEnabled.id : null;
    renderTabs();
    updateCount();
    el.hint.textContent = firstEnabled ? ('已就绪：' + firstEnabled.label) : '没有可用模型，先配密钥';
  } catch (e) {
    el.hint.textContent = '读取模型列表失败：' + e.message;
  }
})();
</script>
</body>
</html>
