name: Admin Panel Deploy

# 管理页只放在 admin/ 目录，独立部署到 gh-pages 的 admin/ 子目录。
# 站点每次重建会删掉它，所以这里监听 gh-pages 推送，发现缺失就立刻补回。

on:
  push:
    branches: [gh-pages]
  push:
    branches: [master]
    paths: ["admin/**"]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need: ${{ steps.probe.outputs.need }}
    steps:
      - id: probe
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "master" ]; then
            echo "need=yes" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" != "push" ]; then
            echo "need=yes" >> $GITHUB_OUTPUT
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/admin/index.html?ref=gh-pages")
            if [ "$code" = "200" ]; then
              echo "need=no" >> $GITHUB_OUTPUT
            else
              echo "need=yes" >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    needs: check
    if: needs.check.outputs.need == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "admin"
          destination_dir: "admin"
          keep_files: "true"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
