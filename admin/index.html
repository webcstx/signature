<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故障事件</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:26px 14px 40px;background:#f5f6f8;color:#1f2430;font-size:14px;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:18px;margin:0 0 16px;text-align:center;font-weight:600}
.empty{background:#fff;border:1px solid #e6e9ef;border-radius:14px;padding:36px 18px;
text-align:center;color:#6f7684;font-size:15px}
.item{background:#fff;border:1px solid #e6e9ef;border-left:4px solid #e5484d;border-radius:14px;
padding:16px;margin-bottom:12px}
.item .t{font-size:15px;font-weight:600;line-height:1.5;word-break:break-all}
.item .m{font-size:12px;color:#8b93a1;margin-top:8px;line-height:1.7}
.item .b{margin-top:12px}
button{width:100%;border:0;border-radius:10px;padding:11px;font-size:14px;cursor:pointer;
background:#e5484d;color:#fff;font-family:inherit;letter-spacing:1px}
button:disabled{background:#c9ced8}
.mask{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:9}
.mask.hidden{display:none}
.dlg{width:100%;max-width:320px;background:#fff;border-radius:16px;padding:20px}
.dlg h2{font-size:15px;margin:0 0 14px;font-weight:600}
.dlg input{width:100%;border:1px solid #dfe4ec;border-radius:10px;padding:12px;font-size:15px;
outline:none;font-family:inherit;color:#1f2430}
.dlg input:focus{border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.err{font-size:12px;color:#c33;margin-top:10px;min-height:16px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{background:#eceff4;color:#1f2430;font-size:14px;letter-spacing:0}
.acts .ok{background:#e5484d;color:#fff}
.msg{font-size:12.5px;color:#6f7684;text-align:center;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>故障事件</h1>
  <div id="list"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="mask hidden" id="mask">
  <div class="dlg">
    <h2>关闭故障事件</h2>
    <input id="pw" type="password" placeholder="输入密码" autocomplete="off">
    <div class="err" id="err"></div>
    <div class="acts">
      <button onclick="shut()">取消</button>
      <button class="ok" onclick="confirmClose()">确认关闭</button>
    </div>
  </div>
</div>

<script>
var REPO = 'webcstx/signature';
var PASS = '520214';
var $ = function(i){ return document.getElementById(i); };
var pending = null, issues = [];

function say(t){ $('msg').textContent = t || ''; }

function load(){
  say('读取中…');
  fetch('https://api.github.com/repos/' + REPO + '/issues?state=open&per_page=100')
    .then(function(r){ return r.json(); })
    .then(function(d){
      issues = (d || []).filter(function(x){
        if (x.pull_request) return false;
        var lb = (x.labels || []).map(function(l){ return l.name; });
        return lb.indexOf('status') > -1;
      });
      render();
    })
    .catch(function(){ say('读取失败，稍后重试'); });
}

function render(){
  say('');
  var box = $('list');
  box.innerHTML = '';
  if (!issues.length){
    box.innerHTML = '<div class="empty">暂未触发故障事件</div>';
    return;
  }
  issues.forEach(function(x){
    var el = document.createElement('div');
    el.className = 'item';
    var dt = new Date(x.created_at);
    var when = dt.getFullYear() + '-' + (dt.getMonth()+1) + '-' + dt.getDate() + ' ' +
               String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
    el.innerHTML = '<div class="t"></div><div class="m"></div><div class="b"><button>关 闭</button></div>';
    el.querySelector('.t').textContent = x.title;
    el.querySelector('.m').textContent = '发生在 ' + when + ' · 工单 #' + x.number;
    el.querySelector('button').onclick = function(){ openDialog(x); };
    box.appendChild(el);
  });
}

function openDialog(x){
  pending = x;
  $('err').textContent = '';
  $('pw').value = '';
  $('mask').classList.remove('hidden');
  setTimeout(function(){ $('pw').focus(); }, 50);
}

function shut(){ $('mask').classList.add('hidden'); pending = null; }

function confirmClose(){
  if ($('pw').value.trim() !== PASS){ $('err').textContent = '密码不对'; return; }
  var x = pending;
  shut();
  if (!x) return;
  var url = 'https://github.com/' + REPO + '/issues/' + x.number;
  say('已打开工单 #' + x.number + '，在那里点 Close issue 即可关闭');
  window.open(url, '_blank');
}
</script>
</body>
</html>
