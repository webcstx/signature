<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>故障单关闭</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#f5f6f8;color:#1f2430;font-size:14px;padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{width:100%;max-width:380px}
.card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:26px 20px;
box-shadow:0 2px 8px rgba(16,24,40,.06);text-align:center}
h1{font-size:17px;margin:0 0 16px;font-weight:600}
label{display:block;font-size:12px;color:#6f7684;margin:0 0 7px;text-align:left}
input{width:100%;border:1px solid #dfe4ec;border-radius:10px;padding:12px;font-size:15px;
outline:none;font-family:inherit;color:#1f2430;background:#fff}
input:focus{border-color:#2f6bff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;cursor:pointer;
background:#2f6bff;color:#fff;font-family:inherit}
button.shut{background:#e5484d;letter-spacing:2px;font-size:16px;padding:14px}
button:disabled{background:#c9ced8;cursor:default}
.msg{font-size:12.5px;line-height:1.8;margin-top:10px;min-height:18px;text-align:center}
.ok{color:#0e8f6e}.bad{color:#c33}
.hidden{display:none}
.mask{position:fixed;inset:0;background:rgba(15,17,21,.45);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:9}
.mask.hidden{display:none}
.dlg{width:100%;max-width:320px;background:#fff;border-radius:16px;padding:20px;text-align:left}
.dlg h2{font-size:15px;margin:0 0 14px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{font-size:14px;padding:11px;background:#eceff4;color:#1f2430}
.acts .ok2{background:#e5484d;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginBox">
    <h1>故障单</h1>
    <label>密码</label>
    <input id="pass" type="password" placeholder="输入密码" autocomplete="off">
    <div style="margin-top:14px"><button onclick="login()">进入</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="card hidden" id="panel">
    <h1>故障单</h1>
    <div class="msg" id="incState">读取中…</div>
    <div style="margin-top:12px"><button class="shut" id="incBtn" onclick="openClose()">关 闭</button></div>
    <div class="msg" id="incMsg"></div>
  </div>
</div>

<div class="mask hidden" id="mask">
  <div class="dlg">
    <h2>确认关闭</h2>
    <label>密码</label>
    <input id="closePw" type="password" placeholder="输入密码" autocomplete="off">
    <div class="msg bad" id="closeErr" style="text-align:left"></div>
    <div class="acts">
      <button onclick="shutDialog()">取消</button>
      <button class="ok2" onclick="doClose()">确认</button>
    </div>
  </div>
</div>

<script>
var REPO = 'webcstx/signature';
var CLOSE_PASS = '520214';
var $ = function(i){ return document.getElementById(i); };
var key = '';

function say(kind, text, el){
  var m = $(el);
  m.className = 'msg ' + (kind || '');
  m.textContent = text || '';
}

function gh(path, opts){
  return fetch('https://api.github.com' + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + key, 'Accept': 'application/vnd.github+json',
               'Content-Type': 'application/json' }
  }, opts || {})).then(function(r){
    if (r.status === 401) throw new Error('密码错误或已失效');
    if (r.status === 404) throw new Error('没有这个仓库的权限');
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error(d.message || ('HTTP ' + r.status));
      return d;
    });
  });
}

function listOpen(d){
  return (d || []).filter(function(x){
    if (x.pull_request) return false;
    var lb = (x.labels || []).map(function(l){ return l.name; });
    return lb.indexOf('status') > -1;
  });
}

function loadIncidents(){
  say('', '读取中…', 'incState');
  fetch('https://api.github.com/repos/' + REPO + '/issues?state=open&per_page=100')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var n = listOpen(d).length;
      say('', n ? '当前有 ' + n + ' 张未关闭的故障单' : '当前没有未关闭的故障单', 'incState');
      $('incBtn').disabled = !n;
    })
    .catch(function(){
      say('bad', '读取失败', 'incState');
      $('incBtn').disabled = true;
    });
}

function login(){
  var pw = $('pass').value.trim();
  if (!pw){ say('bad', '请输入密码', 'loginMsg'); return; }
  say('', '验证中…', 'loginMsg');
  key = pw;
  gh('/repos/' + REPO).then(function(){
    $('loginBox').classList.add('hidden');
    $('panel').classList.remove('hidden');
    loadIncidents();
  }).catch(function(e){
    key = '';
    say('bad', e.message, 'loginMsg');
  });
}

function openClose(){
  $('closeErr').textContent = '';
  $('closePw').value = '';
  $('mask').classList.remove('hidden');
  setTimeout(function(){ $('closePw').focus(); }, 50);
}

function shutDialog(){ $('mask').classList.add('hidden'); }

function doClose(){
  var pw = $('closePw').value.trim();
  if (pw !== CLOSE_PASS){ $('closeErr').textContent = '密码不对'; return; }
  $('incBtn').disabled = true;
  say('', '提交中…', 'incState');
  gh('/repos/' + REPO + '/issues?state=open&per_page=100').then(function(d){
    var list = listOpen(d);
    if (!list.length) return 0;
    return Promise.all(list.map(function(x){
      return gh('/repos/' + REPO + '/issues/' + x.number, {
        method: 'PATCH',
        body: JSON.stringify({ state: 'closed', state_reason: 'not_planned' })
      }).then(function(){ return 1; }).catch(function(){ return 0; });
    })).then(function(a){ return a.reduce(function(p, c){ return p + c; }, 0); });
  }).then(function(n){
    shutDialog();
    say('ok', n ? '已关闭 ' + n + ' 张' : '没有需要关闭的', 'incMsg');
    loadIncidents();
  }).catch(function(e){
    shutDialog();
    say('bad', '失败：' + e.message, 'incMsg');
    loadIncidents();
  });
}
</script>
</body>
</html>
